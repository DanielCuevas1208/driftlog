name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
      - name: Fetch dependencies
        run: gleam deps download
      - name: Check formatting
        run: gleam format --check src test
      - name: Typecheck
        run: gleam check
      - name: Run tests
        run: gleam test
      - name: Replay fixture scenarios
        run: |
          gleam run -- replay fixtures/concurrent-typing.json
          gleam run -- replay fixtures/field-notes.json
          gleam run -- replay fixtures/team-tags.json
      - name: Build the release target
        run: gleam build
